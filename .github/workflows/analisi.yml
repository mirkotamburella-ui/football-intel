# Analisi automatica + pubblicazione della dashboard su GitHub Pages.
# Gira sui server di GitHub (gratis), senza computer acceso e senza usare Claude.
#
# Budget The Odds API (piano gratuito: 500 crediti/mese): 2 analisi al giorno da max 8 crediti
# = 480 crediti/mese. Orari in UTC; con l'ora solare italiana (UTC+1):
#   08:30 analisi completa · 17:30 aggiornamento prima delle partite serali · 23:45 verifica risultati
# (con l'ora legale scattano un'ora più tardi; GitHub può ritardarli di qualche minuto).
name: Analisi automatica

on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 16 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch: {}   # pulsante "Run workflow" per lanciarla a mano

permissions:
  contents: write   # salva lo storico delle previsioni nel branch "data"
  pages: write
  id-token: write

concurrency:
  group: analisi
  cancel-in-progress: false

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_MAX_CREDITS_PER_RUN: "8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Recupera storico e ultima analisi
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:history.json > data/history.json || rm -f data/history.json
            git show FETCH_HEAD:latest.json > data/latest.json || rm -f data/latest.json
          fi

      - name: Verifica risultati delle partite concluse
        run: python -m fbi verify || echo "verifica non completata (riprova al prossimo giro)"

      - name: Analisi (12 agenti)
        # il giro serale (22 UTC) fa solo la verifica dei risultati, senza consumare crediti
        run: |
          H=$(date -u +%H)
          if [ "$H" = "22" ] && [ -f data/latest.json ]; then echo "solo verifica"; 
          elif [ "$H" = "07" ] || [ ! -f data/latest.json ]; then python -m fbi run;
          else python -m fbi refresh; fi

      - name: Crea la pagina
        run: |
          mkdir -p site
          python scripts/export_mobile.py site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Salva lo storico nel branch "data"
        run: |
          cp data/history.json /tmp/history.json
          cp data/latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-tmp
          git rm -rf --quiet .
          git clean -fdq -e data
          cp /tmp/history.json history.json
          cp /tmp/latest.json latest.json
          git add history.json latest.json
          git commit -q -m "storico $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:data

      - id: deploy
        uses: actions/deploy-pages@v4
