# Analisi automatica + pubblicazione della dashboard su GitHub Pages.
# Gira sui server di GitHub (gratis), senza computer acceso e senza usare Claude.
#
# Budget The Odds API (piano gratuito: 500 crediti/mese): 1 analisi completa al mattino (oggi + domani)
# e 1 aggiornamento pomeridiano, max 8 crediti ciascuno (~480/mese). Un campionato costa uguale per 1 o
# più giorni. Gli altri giri orari fanno solo la verifica dei risultati, senza crediti.
name: Analisi automatica

on:
  schedule:
    # un giro ogni ora: lo script scripts/schedule_decide.py decide se analizzare, aggiornare o solo
    # verificare. Così i ritardi di GitHub (anche di ore) non fanno saltare l'analisi del mattino.
    - cron: "17 * * * *"
  workflow_dispatch:      # pulsante "Run workflow" per lanciarla a mano
    inputs:
      modo:
        description: "analisi = partite di oggi (8 crediti) · settimana = prossimi giorni (24 crediti) · pagina = ripubblica senza crediti"
        type: choice
        options: [analisi, settimana, focus, pagina]
        default: analisi
      giorni:
        description: "solo per 'settimana': quanti giorni analizzare da oggi (molti bookmaker aprono il palinsesto ~3 giorni prima)"
        type: choice
        options: ["3", "5", "7"]
        default: "3"
      competizione:
        description: "solo per 'focus': testo della competizione da analizzare (es. Nations League, Serie A)"
        type: string
        default: "Nations League"

permissions:
  contents: write   # salva storico e ultime analisi nel branch "data"
  pages: write
  id-token: write

concurrency:
  group: analisi
  cancel-in-progress: false

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_MAX_CREDITS_PER_RUN: "8"
      MODO: ${{ github.event.inputs.modo }}
      GIORNI: ${{ github.event.inputs.giorni || '3' }}
      COMPETIZIONE: ${{ github.event.inputs.competizione || 'Nations League' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Recupera storico e ultime analisi
        run: |
          mkdir -p data week focus
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:history.json > data/history.json || rm -f data/history.json
            git show FETCH_HEAD:latest.json > data/latest.json || rm -f data/latest.json
            git show FETCH_HEAD:state.json > data/state.json || rm -f data/state.json
            git show FETCH_HEAD:latest_week.json > week/latest.json || rm -f week/latest.json
            git show FETCH_HEAD:latest_focus.json > focus/latest.json || rm -f focus/latest.json
          fi

      - name: Verifica risultati delle partite concluse
        run: python -m fbi verify || echo "verifica non completata (riprova al prossimo giro)"

      - name: Analisi (12 agenti)
        run: |
          AZIONE=$(python scripts/schedule_decide.py data)
          echo "giro: modo=${MODO:-automatico} azione=$AZIONE"
          if [ "$MODO" = "pagina" ]; then echo "solo pagina"
          elif [ "$MODO" = "focus" ]; then
            cp data/history.json focus/history.json 2>/dev/null || true
            FBI_DATA_DIR=focus ONLY_COMPETITIONS="$COMPETIZIONE" python -m fbi run
          elif [ "$MODO" = "settimana" ]; then
            cp data/history.json week/history.json 2>/dev/null || true
            FBI_DATA_DIR=week HORIZON_DAYS=$GIORNI ODDS_API_MAX_CREDITS_PER_RUN=24 python -m fbi run
            cp week/history.json data/history.json
          elif [ "$MODO" = "analisi" ] || [ "$AZIONE" = "run" ]; then
            HORIZON_DAYS=2 python -m fbi run
          elif [ "$AZIONE" = "refresh" ]; then
            HORIZON_DAYS=2 python -m fbi refresh
            echo "{\"refresh\": \"$(TZ=Europe/Rome date +%F)\"}" > data/state.json
          else echo "nessuna nuova analisi (azione: $AZIONE)"; fi

      - name: Crea le pagine
        run: |
          mkdir -p site
          python scripts/export_mobile.py site/index.html --report data/latest.json --history data/history.json --nav oggi
          if [ -f focus/latest.json ]; then
            python scripts/export_mobile.py site/focus.html --report focus/latest.json --history data/history.json --nav focus
          fi
          if [ -f week/latest.json ]; then
            python scripts/export_mobile.py site/settimana.html --report week/latest.json --history data/history.json --nav settimana
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Salva storico e ultime analisi nel branch "data"
        run: |
          mkdir -p /tmp/state
          cp data/history.json data/latest.json /tmp/state/
          [ -f data/state.json ] && cp data/state.json /tmp/state/ || true
          [ -f week/latest.json ] && cp week/latest.json /tmp/state/latest_week.json || true
          [ -f focus/latest.json ] && cp focus/latest.json /tmp/state/latest_focus.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-tmp
          git rm -rf --quiet .
          git clean -fdq
          cp /tmp/state/* .
          git add -A
          git commit -q -m "stato $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:data

      - id: deploy
        uses: actions/deploy-pages@v4
