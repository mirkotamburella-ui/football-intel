# Analisi automatica + pubblicazione della dashboard su GitHub Pages.
# Gira sui server di GitHub (gratis), senza computer acceso e senza usare Claude.
#
# Budget The Odds API (piano gratuito: 500 crediti/mese): 2 analisi al giorno da max 8 crediti
# (~480/mese). L'analisi "settimana" (avvio manuale) usa max 24 crediti: un campionato costa uguale
# per 1 o 7 giorni. Orari in UTC; con l'ora solare italiana (UTC+1):
#   08:30 analisi completa · 17:30 aggiornamento prima delle partite serali · 23:45 verifica risultati
# (con l'ora legale scattano un'ora più tardi; GitHub può ritardarli di qualche minuto).
name: Analisi automatica

on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 16 * * *"
    - cron: "45 22 * * *"
  workflow_dispatch:      # pulsante "Run workflow" per lanciarla a mano
    inputs:
      modo:
        description: "analisi = partite di oggi (8 crediti) · settimana = prossimi 7 giorni (24 crediti) · pagina = ripubblica senza crediti"
        type: choice
        options: [analisi, settimana, pagina]
        default: analisi

permissions:
  contents: write   # salva storico e ultime analisi nel branch "data"
  pages: write
  id-token: write

concurrency:
  group: analisi
  cancel-in-progress: false

jobs:
  analisi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Rome
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_MAX_CREDITS_PER_RUN: "8"
      MODO: ${{ github.event.inputs.modo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Recupera storico e ultime analisi
        run: |
          mkdir -p data week
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:history.json > data/history.json || rm -f data/history.json
            git show FETCH_HEAD:latest.json > data/latest.json || rm -f data/latest.json
            git show FETCH_HEAD:latest_week.json > week/latest.json || rm -f week/latest.json
          fi

      - name: Verifica risultati delle partite concluse
        run: python -m fbi verify || echo "verifica non completata (riprova al prossimo giro)"

      - name: Analisi (12 agenti)
        run: |
          H=$(date -u +%H)
          if [ "$MODO" = "pagina" ]; then echo "solo pagina"
          elif [ "$MODO" = "settimana" ]; then
            cp data/history.json week/history.json 2>/dev/null || true
            FBI_DATA_DIR=week HORIZON_DAYS=7 ODDS_API_MAX_CREDITS_PER_RUN=24 python -m fbi run
            cp week/history.json data/history.json
          elif [ "$H" = "22" ] && [ -f data/latest.json ]; then echo "solo verifica (nessun credito)"
          elif [ "$H" = "07" ] || [ ! -f data/latest.json ]; then python -m fbi run
          else python -m fbi refresh; fi

      - name: Crea le pagine
        run: |
          mkdir -p site
          python scripts/export_mobile.py site/index.html --report data/latest.json --history data/history.json --nav oggi
          if [ -f week/latest.json ]; then
            python scripts/export_mobile.py site/settimana.html --report week/latest.json --history data/history.json --nav settimana
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Salva storico e ultime analisi nel branch "data"
        run: |
          mkdir -p /tmp/state
          cp data/history.json data/latest.json /tmp/state/
          [ -f week/latest.json ] && cp week/latest.json /tmp/state/latest_week.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan state-tmp
          git rm -rf --quiet .
          git clean -fdq
          cp /tmp/state/* .
          git add -A
          git commit -q -m "stato $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin HEAD:data

      - id: deploy
        uses: actions/deploy-pages@v4
