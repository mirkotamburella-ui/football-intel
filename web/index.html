<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Football Intelligence</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1>Football Intelligence</h1>
      <p class="sub" id="meta">Caricamento…</p>
    </div>
    <div class="actions">
      <button id="btn-reload" class="icon" title="Ricarica dati" aria-label="Ricarica dati">⟳</button>
      <button id="btn-run" class="icon" title="Avvia analisi / refresh" aria-label="Avvia analisi" hidden>▶</button>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="today" class="active">Oggi</button>
    <button role="tab" data-tab="accas">Multiple</button>
    <button role="tab" data-tab="matches">Partite</button>
    <button role="tab" data-tab="agents">Agenti</button>
    <button role="tab" data-tab="history">Storico</button>
  </nav>
</header>

<div class="rg" role="note">
  <strong>Solo analisi e simulazione.</strong> Le probabilità sono stime: puoi perdere l'intera puntata.
  Budget massimo 10 €, mai aumentare la puntata dopo una perdita. 18+ · Telefono Verde 800 558822
</div>

<main>
  <section id="tab-today" class="tab active"></section>
  <section id="tab-accas" class="tab"></section>
  <section id="tab-matches" class="tab"></section>
  <section id="tab-agents" class="tab"></section>
  <section id="tab-history" class="tab"></section>
</main>

<dialog id="detail"><div id="detail-body"></div><form method="dialog"><button class="close">Chiudi</button></form></dialog>
<script src="app.js"></script>
</body>
</html>
